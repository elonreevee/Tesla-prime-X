<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Tesla Prime X</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<header class="auth-header">

    <a href="/" class="logo">
        TESLA <span>PRIME X</span>
    </a>

</header>


<main class="auth-page">

    <div class="auth-card">

        <div class="auth-heading">

            <span class="auth-label">
                WELCOME BACK
            </span>

            <h1>Login</h1>

            <p>
                Sign in to your Tesla Prime X account.
            </p>

        </div>


        <form id="loginForm">

            <div class="form-group">

                <label for="loginEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-button login-button"
            >
                Login
            </button>


            <div id="loginMessage" class="auth-message"></div>


        </form>


        <p class="auth-switch">

            Don't have an account?

            <a href="/signup.html">
                Sign Up
            </a>

        </p>

    </div>

</main>


<script src="script.js"></script>

</body>
</html>
