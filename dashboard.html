<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Account | Tesla Prime X</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<header class="dashboard-header">

    <a href="/" class="logo">
        TESLA <span>PRIME X</span>
    </a>

    <button id="logoutButton" class="logout-button">
        Logout
    </button>

</header>


<main class="dashboard-page">

    <div class="dashboard-card">

        <span class="auth-label">
            MY ACCOUNT
        </span>

        <h1>
            Welcome, <span id="dashboardName"></span>
        </h1>

        <p class="dashboard-intro">
            Your Tesla Prime X account is active.
        </p>


        <div class="user-information">

            <div class="user-detail">

                <small>
                    FULL NAME
                </small>

                <strong id="userName"></strong>

            </div>


            <div class="user-detail">

                <small>
                    EMAIL
                </small>

                <strong id="userEmail"></strong>

            </div>


            <div class="user-detail">

                <small>
                    PHONE
                </small>

                <strong id="userPhone"></strong>

            </div>


            <div class="user-detail">

                <small>
                    ACCOUNT CREATED
                </small>

                <strong id="userCreated"></strong>

            </div>

        </div>


        <div class="account-status">

            <span class="status-dot"></span>

            Account Active

        </div>


        <div class="dashboard-actions">

            <a href="/#vehicles" class="dashboard-button">
                Explore Vehicles
            </a>

            <a href="/#investment" class="dashboard-button">
                Investment Plans
            </a>

            <a href="/#membership" class="dashboard-button">
                Membership
            </a>

        </div>

    </div>

</main>


<script src="script.js"></script>

</body>
</html>
