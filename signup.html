<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Tesla Prime X</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="auth-header">

    <a href="/" class="logo">
        TESLA <span>PRIME X</span>
    </a>

</header>


<main class="auth-page">

    <div class="auth-card">

        <div class="auth-heading">

            <span class="auth-label">
                ACCOUNT
            </span>

            <h1>Create Your Account</h1>

            <p>
                Create your Tesla Prime X account to continue.
            </p>

        </div>


        <form id="signupForm">

            <div class="form-group">

                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="8"
                    required
                >

            </div>


            <label class="checkbox-row">

                <input type="checkbox" required>

                <span>
                    I agree to the Terms & Conditions.
                </span>

            </label>


            <button
                type="submit"
                class="auth-button signup-button"
            >
                Sign Up
            </button>


            <div id="signupMessage" class="auth-message"></div>


        </form>


        <p class="auth-switch">

            Already have an account?

            <a href="/login.html">
                Login
            </a>

        </p>

    </div>

</main>


<script src="script.js"></script>

</body>
</html>
